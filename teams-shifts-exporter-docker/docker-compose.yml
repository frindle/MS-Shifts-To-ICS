services:
  teams-shifts:
    build:
      context: ..
      dockerfile: teams-shifts-exporter-docker/Dockerfile
    container_name: teams-shifts-sync
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/frindle/MS-Shifts-To-ICS/main/icon.png"
    restart: unless-stopped
    environment:
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN}
      - PUSHOVER_USER=${PUSHOVER_USER}
      # Optional Nextcloud / CalDAV target (can also be set from the dashboard)
      - NEXTCLOUD_URL=${NEXTCLOUD_URL:-}
      - NEXTCLOUD_USER=${NEXTCLOUD_USER:-}
      - NEXTCLOUD_APP_PASSWORD=${NEXTCLOUD_APP_PASSWORD:-}
      - NEXTCLOUD_CALENDAR_NAME=${NEXTCLOUD_CALENDAR_NAME:-}
      - WORK_LOCATION=${WORK_LOCATION:-}
      - WORK_GEO=${WORK_GEO:-}
    volumes:
      - chrome-profile:/data/chrome-profile
    shm_size: "256mb"
    networks:
      teams_shifts_net:
        ipv4_address: ${SHIFTS_IPV4:?set SHIFTS_IPV4 in .env}

networks:
  teams_shifts_net:
    driver: macvlan
    driver_opts:
      parent: br0        # match your Unraid bridge interface (br0 is the default)
    ipam:
      config:
        - subnet: ${LAN_SUBNET:?set LAN_SUBNET in .env}
          gateway: ${LAN_GATEWAY:?set LAN_GATEWAY in .env}

volumes:
  chrome-profile:
